{% extends "base.html" %}
{% block title %}Forgot Password - KIRAYA-HAA{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-4 py-8">
  <h1 class="text-2xl font-bold">Reset password</h1>
  <form method="post" class="mt-6 space-y-4 rounded-lg border border-slate-200 bg-white p-5">
    {{ form.hidden_tag() }}
    <div>{% set field = form.email %}{% include "partials/input.html" %}</div>
    {{ form.submit(class="btn-primary w-full") }}
  </form>
</section>
{% endblock %}
